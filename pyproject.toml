[project]
name = "petabite"
version = "0.1.0"
description = "ESM-C LoRA masked-LM fine-tuning on the Logan-derived PETadex"
requires-python = ">=3.10"
# On Compute Canada the heavy wheels come from the wheelhouse
# (`pip install --no-index <pkgs>`), and numpy/scipy/scikit-learn are provided
# by the scipy-stack module. They are listed anyway so a non-CC install works.
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "datasets>=2.19",
    "huggingface_hub>=0.23",
    "safetensors>=0.4",
    "wandb>=0.17",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "numpy>=1.26",
    # Required rather than optional: biohub/ESMC-300M ships a remote-code shim
    # whose from_pretrained returns an `esm` model, so nothing here loads
    # without it. 3.4.1 is a hard floor. The checkpoint's own loader raises on
    # anything older, and 3.4.1 is also where the fused module classes that
    # LoRA targets were renamed.
    "esm>=3.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # Only needed for notebooks/, which are data-prep scratch work rather than
    # part of the pipeline.
    "notebook>=7.0",
]

[project.scripts]
# A hydra entrypoint, so it accepts key=value overrides.
petabite-mlm = "petabite.mlm_finetune:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/petabite"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
# `import torch.nn.functional as F` is the universal PyTorch spelling; renaming
# it would be less readable than the lint it trips.
ignore = ["N812"]

[tool.mypy]
# The cluster module is python/3.12.4; checking against 3.10 hid real issues.
python_version = "3.12"
ignore_missing_imports = true
mypy_path = "src"
packages = ["petabite"]

[tool.pytest.ini_options]
# No pythonpath entry: the package is installed with `pip install -e .`, which
# is also what makes `python -m petabite.mlm_finetune` work.
testpaths = ["tests"]
