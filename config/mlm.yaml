# Stage 1, PlasticESM: domain-adapt ESM-C on the Logan-derived PETadex.
# The PETadex (petadex/catalytic-orfs-90pid) holds the 90%-identity centroids of
# the plastic-degrading enzyme homologs mined from the Logan planetary-scale SRA
# assembly. Continued pretraining with the masked-LM objective produces
# PlasticESM, a domain-adapted backbone for downstream activity work (which
# lives outside this repo).
# Used by `python -m petabite.mlm_finetune`.
seed: 42
output_dir: outputs/esmc-mlm-lora-bs16-r32

data:
  dataset_id: petadex/catalytic-orfs-90pid   # the dataset pushed from the notebook
  # Set to the output of scripts/pretokenize_corpus.py to skip tokenization at
  # startup. Assembling 18,172,960 rows and tokenizing them costs minutes per
  # job otherwise, repeated for every rung of an ablation ladder.
  tokenized_path: null
  sequence_column: Sequence
  train_split: train
  # This corpus ships `train` and `test`. It has no `validation` split, and
  # asking for one raised a bare KeyError.
  eval_split: test
  # Used only when eval_split is absent, in which case this many rows are held
  # out of the tail of train.
  eval_holdout_size: 5000
  max_length: 1024
  mlm_probability: 0.15
  num_proc: 8
  # Caps for quick smoke tests; null = use the whole split.
  max_train_samples: null
  max_eval_samples: 5000

model:
  model_id: biohub/ESMC-300M
  trust_remote_code: true

  lora_r: 32
  # alpha/r is the scaling applied to the low-rank branch, so 16/32 scales it
  # by 0.5.
  lora_alpha: 16
  lora_dropout: 0.01

  # The four projections in an ESM-C block. `qkv` and `out_proj` are attention,
  # `fc1` and `fc2` are the SwiGLU FFN. Only out_proj is a plain nn.Linear,
  # which is why PEFT could never reach the other three. Drop any entry to
  # ablate it.
  lora_targets: [qkv, out_proj, fc1, fc2]

  # Checks each wrapper still reproduces the module it replaced. One forward
  # pass on a tiny tensor; leave it on.
  lora_verify: true

  # ESM-C's forward defaults this to true, which runs a sparse autoencoder head
  # that masked-LM training never reads.
  compute_sae: false

trainer:
  num_train_epochs: 1
  # -1 means train for num_train_epochs. Set a positive value for smoke tests.
  max_steps: -1

  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 1

  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  max_grad_norm: 1.0

  logging_steps: 50
  eval_strategy: steps
  eval_steps: 1000
  save_strategy: steps
  save_steps: 1000
  save_total_limit: 3

  bf16: true            # set false (and fp16: true) on older GPUs without bf16
  fp16: false
  # The base is frozen, so activations are the only real memory cost and
  # recomputing them would just cost time.
  gradient_checkpointing: false

  dataloader_num_workers: 4
  dataloader_pin_memory: true
  dataloader_persistent_workers: false
  # Buckets similar lengths together so a batch is not padded out to its
  # longest member. The length column is added during tokenization.
  group_by_length: false
  length_column_name: length
  optim: adamw_torch

  # null = fresh run; true = resume the latest checkpoint in output_dir; or a
  # path. Resuming requires lora_adapters.safetensors in that checkpoint: a
  # checkpoint without one would restart every adapter from zero while the
  # optimizer resumed its stale moments, so it refuses rather than doing that
  # silently.
  resume_from_checkpoint: null

wandb:
  enabled: true
  project: petabite-esmc
  entity: null          # null = your default W&B entity
  # Compute nodes on this cluster do have outbound network, verified from
  # kn089, so runs stream live. Set to offline for an isolated node and upload
  # afterwards with `wandb sync wandb/offline-run-*`.
  mode: online
  run_name: esmc-300m-lora-mlm-bs16-r32

push_to_hub:
  enabled: false
  repo_id: petadex/esmc-300m-catalytic-lora
  private: false
